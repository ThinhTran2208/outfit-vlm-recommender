limit_req_zone $binary_remote_addr zone=analyze:10m rate=6r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    client_body_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/analyze {
        limit_req zone=analyze burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_read_timeout 240s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 240s;
        proxy_connect_timeout 5s;
    }
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"status":"error","error_code":"INVALID_IMAGE","message_vi":"Ảnh vượt quá dung lượng cho phép."}';
    }
    error_page 429 = @busy;
    location @busy {
        default_type application/json;
        return 429 '{"status":"error","error_code":"SERVER_BUSY","message_vi":"Vui lòng thử lại sau."}';
    }
    location / { try_files $uri $uri/ /index.html; }
}
